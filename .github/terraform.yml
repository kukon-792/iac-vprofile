name: "Vprofile IAC"
on:
  push:
    branches:
      - main
      - stage
    paths:
      - tarraform/**
  pull_request:
    branches:
       - main
    paths:
       - terraform/**

env:
 # Credentials for deployment to AWS
 AWS_ACCESS_KEY_ID: ${{ secrets. AWS_ACCESS_KEY_ID}}
 AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY}}
 # S3 bucket for the Terraform state
 KMBUCKET_TF_STATE: ${{ secrets.KMBUCKET_TF_STATE}}
 AWS_REGION: us-east-2
 EKS_CLUSTER: kmvprofile-eks

 jobs:
   terraform:
     name: "Apply terraform code changes"
     runs-on: ubuntu-latest
     defaults:
       runs:
         shell: bash
         working-directory: ./terraform

     steps:
       - name: Checkout source code
         uses: actions/checkout@v4

       - name: Setup Terraform with specified version on the running
         uses: hashicorp/setup-terraform@v2
         # with
         # terraform_version: 1.6.3

       - name: Terraform init
         id: init
         run: terraform init -backend-config="bucket=$KMBUCKET_TF_STATE"

       - name: Terraform format
         id: fmt
         run: terraform fmt -check

       - name: Terraform validate
         id: validate
         run: tarraform validate

       - name: Terraform plan
         id: plan
         run: tarraform plan -no-color -input=false -out planfile
         continue-on-error: true

       - name: Terraform plan status
         if: steps.plan.outcome == 'failure'
         run: exit 1
         
